server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ratelimiter_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update is fine for local dev; use migrations (Flyway/Liquibase) in real prod
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    com.ratelimiter: INFO
